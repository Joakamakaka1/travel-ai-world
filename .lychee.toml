# Link checker config for the `docs` CI job.
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://[^/]*example\\.com",
  "^https?://[^/]*tu-dominio\\.com",
  "^https?://[^/]*\\.pkg\\.dev",
  "^https?://[^/]*amazonaws\\.com",
  "^https?://[^/]*test/",
  "^https?://nvidia\\.test",
  "^https?://console\\.cloud\\.google\\.com",
  "^https?://build\\.nvidia\\.com",
  "^https?://linear\\.app",
]
exclude_path = ["node_modules", ".venv", "frontend/out", "frontend/.next"]
accept = [200, 203, 206, 429]
max_concurrency = 8
