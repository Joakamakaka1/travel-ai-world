# City data scraper (Madrid today). A workspace member so it shares the lockfile,
# the virtualenv and the ruff configuration; it is a set of scripts, not an
# installable package, hence `package = false`. Run it from this directory:
#
#   uv run python main.py        (or `just scrape` from the repo root)
[project]
name = "city-scraper"
version = "0.1.1"
description = "Travel AI World data ingestion: points of interest and transport for a city, as JSON"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.13",
    "python-dotenv>=1.1",
]

[tool.uv]
package = false
