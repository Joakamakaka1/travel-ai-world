# Miami tours, maintained by hand.

[[tour]]
id = "bobbys-little-havana-food-culture"
name = "Miami Little Havana Food & Culture Walking Tour"
operator = "Bobby's Bike Hike Miami"
operator_url = "https://www.bobbysbikehike.com/miami/"
url = "https://www.bobbysbikehike.com/miami/tour/miami-little-havana-food-culture-walking-tour/"
tour_type = "food"
price_model = "paid"
summary = """
Paseo guiado por Little Havana con degustaciones cubanas y cubanoamericanas,
historia migratoria, Domino Park, lugares destacados de Calle Ocho, el memorial
de Bahía de Cochinos y una parada relacionada con la elaboración de puros."""
meeting_point = "El Cristo Restaurant"
address = "1543 SW 8th St, Miami, FL 33135"
lat = 25.765908
lon = -80.220383
start_times = ["11:30", "16:00"]
days = "daily"
duration_minutes = 180
languages = ["English"]
booking_required = true
checked = 2026-09-21
notes = """
La cabecera de la página publica tres horas y salidas diarias a las 11:30 y
16:00. Una sección inferior indica aproximadamente 2,5 horas; conviene revisar
esa discrepancia en la próxima actualización."""

