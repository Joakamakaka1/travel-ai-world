name: Set up uv workspace
description: Install uv, Python 3.12 and the backend workspace dependencies (cached).

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: src/backend/uv.lock

    - name: Set up Python
      shell: bash
      run: uv python install 3.12

    - name: Install workspace
      shell: bash
      working-directory: src/backend
      run: uv sync --frozen --all-packages
